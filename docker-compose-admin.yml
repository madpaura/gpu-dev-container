version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpu_dash}
      POSTGRES_USER: ${POSTGRES_USER:-gpu_dash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ${PG_DATA_VOLUME:-./volumes/postgres}:/var/lib/postgresql/data
    networks:
      - gpu-dash-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gpu_dash} -d ${POSTGRES_DB:-gpu_dash}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gpu-dash-admin
    environment:
      # Database configuration (PostgreSQL via service name)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-gpu_dash}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DB_NAME: ${POSTGRES_DB:-gpu_dash}

      # Server configuration
      MGMT_SERVER_PORT: ${BACKEND_PORT:-8500}
      MGMT_SERVER_IP: 0.0.0.0

      # Agent configuration
      AGENT_PORT: ${AGENT_PORT:-8510}

      # Docker configuration
      DOCKER_IMAGE: ${DOCKER_IMAGE:-gpu-dev-environment}
      DOCKER_TAG: ${DOCKER_TAG:-latest}
      DOCKER_HOSTNAME: ${DOCKER_HOSTNAME:-cxl-dev}
      DOCKER_CPU: ${DOCKER_CPU:-4}
      DOCKER_CPU_PERCENT: ${DOCKER_CPU_PERCENT:-100}
      DOCKER_MEM_LMT: ${DOCKER_MEM_LMT:-4g}
      DOCKER_MEM_SWAP: ${DOCKER_MEM_SWAP:-5g}

      # Code server configuration
      CODE_DEFAULT_WORKSPACE: ${CODE_DEFAULT_WORKSPACE:-/workspace}
      CODE_PORT: ${CODE_PORT:-8080}
      CODE_CONFIG_MOUNT: ${CODE_CONFIG_MOUNT:-/config}
      SUDO_PASSWORD: ${SUDO_PASSWORD:-changeme}

      # Jupyter configuration
      JUPYTER_PORT: ${JUPYTER_PORT:-8888}

      # Paths
      QVP_BINARY_MOUNT: ${QVP_BINARY_MOUNT:-/opt/qvp}
      GUEST_OS_MOUNT: ${GUEST_OS_MOUNT:-/opt/os/guestos}
      TOOLS_MOUNT: ${TOOLS_MOUNT:-/opt/tools}
      WORKDIR_TEMPLATE: ${WORKDIR_TEMPLATE:-/home/vishwa/template/}
      WORKDIR_DEPLOY: ${WORKDIR_DEPLOY:-/home/vishwa/vms/}

      # Admin bootstrap credentials
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}

      # Nginx config path (managed by NginxService at runtime for user routing)
      NGINX_CONFIG_FILE: ${NGINX_CONFIG_FILE:-/etc/nginx/sites-available/dev-services}
    ports:
      - "${BACKEND_PORT:-8500}:8500"
    volumes:
      - ${HOST_HOME:-/home/vishwa}:/home/vishwa
      - ${HOST_OPT:-/opt}:/opt
      # Docker socket for container management (read-only where possible).
      # For production, replace with a Docker socket proxy (e.g. tecnativa/docker-socket-proxy)
      # to restrict API access to only the operations the backend needs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Application logs
      - ./backend/logs:/app/logs
      # agents.txt — must exist as a file before 'docker compose up'
      # setup.sh ensures this with 'touch backend/agents.txt'
      - ./backend/agents.txt:/app/agents.txt
    networks:
      - gpu-dash-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend nginx serving the React SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gpu-dash-frontend
    ports:
      - "${FRONTEND_PORT:-9000}:80"
    networks:
      - gpu-dash-net
    depends_on:
      - backend

networks:
  gpu-dash-net:
    driver: bridge
